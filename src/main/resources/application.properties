spring.application.name=mini-mart-system
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=MiniMartSWD392;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:yeuminhduc}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-compatibility.sql
spring.sql.init.continue-on-error=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

app.bootstrap-demo.enabled=${APP_BOOTSTRAP_DEMO:true}
app.bootstrap-demo.password=${APP_DEMO_PASSWORD:MiniMart@123}




