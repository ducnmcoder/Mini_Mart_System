<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt mật khẩu mới | MiniMart</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="recovery-shell">
    <section class="recovery-card">
        <div class="brand"><span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M10 10h3l2.2 12h11l2.4-8H15.4M17 28a1.7 1.7 0 1 0 0-3.4A1.7 1.7 0 0 0 17 28Zm9 0a1.7 1.7 0 1 0 0-3.4A1.7 1.7 0 1 0 26 28Z"/></svg></span><span>Mini<span>Mart</span></span></div>
        <div class="login-heading">
            <h2>Đặt mật khẩu mới</h2>
            <p>Nhập mật khẩu mới và xác nhận để tiếp tục vào tài khoản.</p>
        </div>
        <div class="alert alert--error" th:if="${errorMessage}" role="alert" th:text="${errorMessage}"></div>
        <form class="login-form" th:action="@{/forgot-password/reset}" method="post">
            <div class="form-field">
                <label for="newPassword">Mật khẩu mới</label>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required autofocus>
            </div>
            <div class="form-field">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <button class="button button--primary button--wide" type="submit">Lưu mật khẩu và tiếp tục</button>
        </form>
    </section>
</main>
</body>
</html>
