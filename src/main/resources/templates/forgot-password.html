<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu | MiniMart</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="recovery-shell">
    <section class="recovery-card">
        <div class="brand"><span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M10 10h3l2.2 12h11l2.4-8H15.4M17 28a1.7 1.7 0 1 0 0-3.4A1.7 1.7 0 0 0 17 28Zm9 0a1.7 1.7 0 1 0 0-3.4A1.7 1.7 0 0 0 26 28Z"/></svg></span><span>Mini<span>Mart</span></span></div>
        <div class="login-heading">
            <h2>Quên mật khẩu</h2>
            <p>Nhập số điện thoại đã lưu trong tài khoản để đặt mật khẩu mới.</p>
        </div>
        <div class="alert alert--error" th:if="${errorMessage}" role="alert" th:text="${errorMessage}"></div>
        <form class="login-form" th:action="@{/forgot-password}" method="post">
            <div class="form-field">
                <label for="phone">Số điện thoại</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" th:value="${phone}" placeholder="Nhập số điện thoại" maxlength="20" required autofocus>
            </div>
            <button class="button button--primary button--wide" type="submit">Tiếp tục</button>
        </form>
        <a class="forgot-password-link" th:href="@{/login}">Quay lại đăng nhập</a>
    </section>
</main>
</body>
</html>
